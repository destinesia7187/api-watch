[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "api-watch"
version = "1.0.0"
description = "Secure HTTP and REST API monitoring with incident detection and Telegram alerts."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "aiohttp>=3.12,<4",
  "cryptography>=44", "argon2-cffi>=23", "pydantic>=2.14,<3", "pydantic-settings>=2.7,<3", "email-validator>=2.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "httpx>=0.28,<1", "ruff>=0.9"]

[project.scripts]
api-watch = "api_watch.cli:main"

[tool.setuptools.packages.find]
include = ["api_watch*"]

[tool.setuptools.package-data]
api_watch = ["static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
