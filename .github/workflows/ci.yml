name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: apiwatch_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d apiwatch_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/apiwatch_test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/apiwatch_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock
      - run: python -m api_watch migrate
      - run: python -m alembic check
      - run: python -m ruff check api_watch tests scripts
      - run: python -m compileall -q api_watch migrations
      - run: python -m pytest -q --basetemp=var/pytest
      - run: node --check api_watch/static/app.js
      - run: node scripts/test_frontend.cjs
      - run: python -m api_watch export-openapi
      - name: Verify OpenAPI snapshot
        run: git diff --exit-code -- docs/openapi.json
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t api-watch:test .
